name: verify

# Runs on GitHub's servers, not locally.
#
#   pull_request → the gate. Opening or updating a PR into main runs the full
#                  suite and marks the PR red or green before you merge it.
#                  This is the check that decides whether a feature is done.
#
#   push to main → a net, not a gate. It runs AFTER a merge has landed, so it
#                  cannot block anything; it exists to catch a merge that was
#                  made locally and pushed without ever opening a PR.
#
# Locally the equivalent single command is `npm run verify`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the Volta pin in package.json.
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          # Authenticates this step's GitHub API calls (resolving "latest") so
          # it draws from the repo's 5,000/hour budget instead of the shared
          # 60/hour unauthenticated limit every runner IP pool competes for.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Boots Postgres, PostgREST, Auth and the API gateway in Docker, then
      # applies every migration. Both the database tests and the integration
      # tests run against this.
      #
      # A full `supabase start` pulls ~9 GB of images on a cold runner, and the
      # suite touches barely a third of it. Excluding what the tests never call
      # leaves ~2.8 GB. Add each service back when the feature that needs it
      # lands:
      #
      #   mailpit      → F4  (password-reset e2e reads the local mailbox)
      #   storage-api  → F9  (business photo uploads)
      #   realtime     → F30 (notification bell subscription)
      #
      # The rest — studio, postgres-meta, edge-runtime, logflare, vector,
      # imgproxy, supavisor — are developer tooling with no test that touches
      # them, and stay off.
      - name: Start local Supabase stack
        run: supabase start -x studio,postgres-meta,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,mailpit,supavisor

      - name: Write test environment
        run: npm run env:test

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:int

      # pgTAP: the exclusion constraint, the availability engine and every RLS
      # policy are proved here rather than from TypeScript, because that is
      # where this system puts correctness (ARCHITECTURE.md §11).
      - run: npm run test:db

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
