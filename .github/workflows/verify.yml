name: verify

# Runs on GitHub's servers, not locally.
#
#   pull_request → the gate. Opening or updating a PR into main runs the full
#                  suite and marks the PR red or green before you merge it.
#                  This is the check that decides whether a feature is done.
#
#   push (main)  → the net. Catches anything that lands on main without going
#                  through the PR gate — a direct push, or a merge whose base
#                  moved after the PR check went green. For a change that did
#                  land through a PR this re-runs the suite a second time; that
#                  duplication is the accepted cost of main always being
#                  verified as it actually stands.
#
# Locally the equivalent single command is `npm run verify`.
on:
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the Volta pin in package.json.
          node-version: 24
          cache: npm

      - run: npm ci

      # Pinned deliberately, same reasoning as the Node pin above. `version:
      # latest` makes the action resolve the tag through
      # api.github.com/repos/supabase/cli/releases/latest, and unauthenticated
      # that shares a 60-requests/hour budget with every other job on GitHub's
      # runner IP pool — which is routinely exhausted, failing the step with
      # "Failed to resolve latest Supabase CLI release: rate limit exceeded"
      # before anything has even been installed. A concrete version skips that
      # call entirely, so there is no limit to hit and no upstream release can
      # turn a green PR red without a commit here.
      #
      # (The action does accept a `github-token:` input to authenticate that
      # call — but note it is an input, under `with:`, not an `env:` var: it
      # is read via core.getInput('github-token'), so setting GITHUB_TOKEN in
      # the environment silently does nothing.)
      #
      # Bump this by hand when there's a reason to; check the local CLI stays
      # in step, since `npm run db:reset` / `test:db` use whatever `npx
      # supabase` resolves to.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # Boots Postgres, PostgREST, Auth and the API gateway in Docker, then
      # applies every migration. Both the database tests and the integration
      # tests run against this.
      #
      # A full `supabase start` pulls ~9 GB of images on a cold runner, and the
      # suite touches barely a third of it. Excluding what the tests never call
      # leaves ~2.8 GB. Add each service back when the feature that needs it
      # lands:
      #
      #   mailpit      → F4  (password-reset e2e reads the local mailbox)
      #   storage-api  → F9  (business photo uploads)
      #   realtime     → F30 (notification bell subscription)
      #
      # The rest — studio, postgres-meta, edge-runtime, logflare, vector,
      # imgproxy, supavisor — are developer tooling with no test that touches
      # them, and stay off.
      - name: Start local Supabase stack
        run: supabase start -x studio,postgres-meta,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,mailpit,supavisor

      - name: Write test environment
        run: npm run env:test

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:int

      # pgTAP: the exclusion constraint, the availability engine and every RLS
      # policy are proved here rather than from TypeScript, because that is
      # where this system puts correctness (ARCHITECTURE.md §11).
      - run: npm run test:db

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
